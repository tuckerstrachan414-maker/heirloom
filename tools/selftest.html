<!DOCTYPE html><html><head><meta charset="utf-8"><title>HEIRLOOM selftest</title>
<style>body{background:#111;color:#ddd;font:13px monospace;margin:0}
#result{padding:10px;white-space:pre-wrap;font-size:14px}
#stage{position:fixed;left:0;top:0;width:640px;height:420px;opacity:0.001;pointer-events:none}
#world{width:640px;height:420px;display:block}</style></head><body>
<pre id="result">running...</pre>
<div id="stage">
  <canvas id="world"></canvas>
  <div id="topbar"><span id="statYear"></span><span id="statPop"></span><span id="statSpecies"></span><span id="statGen"></span>
    <span id="speeds"><button data-speed="0"></button><button data-speed="1"></button><button data-speed="4"></button><button data-speed="16"></button></span>
    <button id="btnNew"></button></div>
  <div id="species"><div id="speciesList"></div></div>
  <div id="inspect" class="hidden"><span id="inspTitle"></span><button id="inspClose"></button><div id="inspBody"></div></div>
  <div id="plagues" class="hidden"><div id="plagueList"></div></div>
  <div id="logcard"><div id="log"></div></div>
  <div id="tools"><div id="toolcats"></div><div id="disasters"></div><div id="hint"></div></div>
  <div id="sheet" class="hidden"><span id="sheetTitle"></span><button id="sheetClose"></button><div id="sheetBody"></div></div>
  <button id="btnTree"></button><button id="btnSave"></button>
  <div id="toast"></div>
</div>
<script>
window.__errors = [];
window.onerror = function (m, s, l, c) { window.__errors.push(m + ' @' + (s||'').split('/').pop() + ':' + l); };
window.addEventListener('unhandledrejection', function(e){ window.__errors.push('promise: ' + e.reason); });
</script>
<script src="../js/rng.js"></script>
<script src="../js/data-traits.js"></script>
<script src="../js/data-strains.js"></script>
<script src="../js/data-plagues.js"></script>
<script src="../js/data-biomes.js"></script>
<script src="../js/data-disasters.js"></script>
<script src="../js/world.js"></script>
<script src="../js/creature.js"></script>
<script src="../js/species.js"></script>
<script src="../js/sim.js"></script>
<script src="../js/plague.js"></script>
<script src="../js/log.js"></script>
<script src="../js/render.js"></script>
<script src="../js/tree.js"></script>
<script src="../js/save.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/main.js"></script>
<script>
var OUT=[], NL=String.fromCharCode(10), R0=document.getElementById('result');
function say(t){OUT.push(t);R0.textContent=OUT.join(NL);}
function step(label,fn){try{say(label+' : '+fn());}catch(e){say(label+' : THREW '+e.message);}}
function colours(cv,n){
  var g=cv.getContext('2d'), d=g.getImageData(0,0,cv.width,cv.height).data, seen={}, c=0;
  var st=Math.max(4,((d.length/4/n)|0)*4);
  for(var i=0;i<d.length;i+=st){var k=(d[i]<<16)|(d[i+1]<<8)|d[i+2];if(!seen[k]){seen[k]=1;c++;}}
  return c;
}
function ashTiles(S){var n=0;for(var i=0;i<S.world.n;i++)if(S.world.ash[i]>0.05)n++;return n;}
setTimeout(function(){
  OUT.length=0;
  var G=window.Game, S=G&&G.sim, R=G&&G.renderer;
  say('errors      : '+(window.__errors.length?window.__errors.join(' | '):'none'));
  if(!S){say('GAME DID NOT START');return;}
  say('raf running : '+(S.year>0.5?'yes, reached year '+S.year.toFixed(1):'NO (year '+S.year.toFixed(2)+') - background tab throttling'));
  step('alive       ',function(){return S.aliveCount+'  born '+S.stats.born+'  deaths '+S.stats.total;});
  step('species     ',function(){return S.species.map(function(s){return s.plural()+' '+s.pop;}).join(', ');});
  step('world/canvas',function(){return S.world.w+'x'+S.world.h+'  canvas '+R.canvas.width+'x'+R.canvas.height+'  dpr '+R.dpr+'  zoom '+R.cam.z.toFixed(1);});
  step('terrain     ',function(){return R.terrain.width+'x'+R.terrain.height+', '+colours(R.terrain,4000)+' distinct colours';});
  step('draw()      ',function(){R.draw();return 'ok, screen shows '+colours(R.canvas,4000)+' distinct colours';});
  step('sprites     ',function(){return R.sprites.size+' baked from genomes';});
  step('ui          ',function(){return document.getElementById('speciesList').children.length+' species rows, '+document.getElementById('toolcats').children.length+' tabs, '+document.getElementById('disasters').children.length+' buttons in the first tab';});
  step('log         ',function(){return G.log.lines.length+' lines';});
  step('300y by hand',function(){
    var t0=performance.now();
    for(var i=0;i<24*300;i++){ S.tick(1/24); if(i%(24*35)===0&&i) G.fire('wildfire',{}); }
    var ms=performance.now()-t0;
    return 'year '+S.year.toFixed(0)+'  alive '+S.aliveCount+'  born '+S.stats.born+'  ('+(24*300/(ms/1000)).toFixed(0)+' ticks/s in-browser)';
  });
  step('speciation  ',function(){
    var kids=S.species.filter(function(s){return s.parent;});
    return S.species.length+' species ever, '+kids.length+' from splits, '+S.livingSpecies().length+' alive'+
      (kids.length?'  ('+kids.map(function(k){return k.plural()+' from '+k.parent.plural()+' y'+k.founded;}).join('; ')+')':'');
  });
  step('strains     ',function(){
    return S.discovered.size+' discovered: '+(S.discovered.size?Array.from(S.discovered).join(', '):'none');
  });
  step('genomes     ',function(){
    var m={},n=0,tt=0,live=0;
    S.creatures.forEach(function(c){if(c.alive){m[c.mask]=1;tt+=c.d.traits.length;live++;}});
    for(var k in m)n++;
    return n+' distinct, avg '+(tt/Math.max(1,live)).toFixed(2)+' traits each';
  });
  step('sprite cache',function(){R.draw();return R.sprites.size+' baked';});
  var before=0;
  step('set a fire  ',function(){
    before=S.aliveCount;
    var sp=S.livingSpecies()[0];
    var line=G.fire('wildfire', sp?{x:Math.round(sp.cx),y:Math.round(sp.cy)}:{});
    return (line||'FAILED TO IGNITE')+'   '+S.world.fires.length+' tiles alight';
  });
  step('run 6y more ',function(){
    for(var i=0;i<24*6;i++) S.tick(1/24);
    return 'alive '+S.aliveCount+' (was '+before+')  burned total '+S.stats.burned+'  ash tiles '+ashTiles(S);
  });
  var pbefore=0;
  function sick(){var n=0;S.creatures.forEach(function(c){if(c.alive&&c.inf)n++;});return n;}
  step('a plague    ',function(){
    pbefore=S.aliveCount;
    var sp=S.livingSpecies()[0];
    var line=G.fire('plague-whisper', sp?{x:Math.round(sp.cx),y:Math.round(sp.cy)}:{});
    return (line||'FAILED TO INFECT')+'   '+sick()+' infected now';
  });
  step('run 45y more',function(){
    var peak=0,trough=S.aliveCount;
    for(var i=0;i<24*45;i++){S.tick(1/24);
      if(i%12===0){var n=sick();if(n>peak)peak=n;}
      if(S.aliveCount<trough)trough=S.aliveCount;}
    return 'alive '+S.aliveCount+' (was '+pbefore+', trough '+trough+')  peak sick '+peak+
           '  plague deaths '+S.stats.plague;
  });
  step('plague evo  ',function(){
    var all=S.plagues.concat(S.pastPlagues);
    if(!all.length) return 'NO LINEAGES AT ALL';
    return all.length+' lineages ('+S.plagues.length+' live): '+all.slice(0,3).map(function(p){
      return p.name+' spread '+p.transmission.toFixed(1)+' kills '+p.lethality.toFixed(2)+' R'+p.spreadRate().toFixed(1);
    }).join('; ');
  });
  step('immunity    ',function(){
    var n=0,g=0;S.creatures.forEach(function(c){if(c.alive&&c.imm){n++;for(var k in c.imm)if(c.imm[k]>g)g=c.imm[k];}});
    return n+' alive carry immune memory, deepest strain survived gen'+g;
  });
  step('plague panel',function(){
    window.UI.refresh();
    var card=document.getElementById('plagues');
    return document.getElementById('plagueList').children.length+' rows, card '+
      (card.classList.contains('hidden')?'hidden (nothing live)':'showing');
  });
  step('save code   ',function(){
    var code=window.SaveCode.encode(G);
    var back=window.SaveCode.decode(code);
    if(typeof back==='string')return 'REFUSED ITS OWN CODE: '+back;
    return code.length+' chars, '+back.events.length+' events, '+Math.round(back.ticks/24)+' years  ['+code.slice(0,64)+'...]';
  });
  step('save refuses',function(){
    var junk=['','hello','H1|s'],out=[];
    for(var i=0;i<junk.length;i++){var r=window.SaveCode.decode(junk[i]);
      out.push(typeof r==='string'?'refused':'ACCEPTED JUNK');}
    return out.join(', ');
  });
  step('family tree ',function(){
    window.UI.showTree();
    var body=document.getElementById('sheetBody');
    if(!body.querySelector('svg')){window.UI.closeSheet();return 'NO SVG';}
    var bars=(body.innerHTML.match(/<rect/g)||[]).length;
    var lines=(body.innerHTML.match(/<path/g)||[]).length;
    var dirty=/NaN|undefined|Infinity/.test(body.innerHTML);
    window.UI.closeSheet();
    return bars+' bars and '+lines+' split lines for '+S.species.length+' species, '+
      (dirty?'BAD NUMBERS IN SVG':'numbers clean')+', '+S.timeline.length+' disasters marked';
  });
  step('save sheet  ',function(){
    window.UI.showSave();
    var box=document.getElementById('savebox');
    var ok=box&&box.value.indexOf('H1|')===0;
    var open=window.UI.sheetOpen();
    window.UI.closeSheet();
    return (ok?'textarea prefilled':'SAVE SHEET BROKEN')+', sheet opened '+open+', closes '+!window.UI.sheetOpen();
  });
  step('redraw      ',function(){R.draw();return 'ok, '+colours(R.canvas,4000)+' distinct colours';});
  step('log tail    ',function(){return G.log.lines.slice(-5).map(function(l){return l.text;}).join('  //  ');});
  // The one path the synchronous steps cannot reach: the real chunked restore.
  function print(S2){
    return [S2.year.toFixed(4), S2.aliveCount, S2.stats.born, S2.stats.total,
      S2.species.map(function(x){return x.plural()+':'+x.pop+':'+x.founded;}).join(','),
      S2.plagues.concat(S2.pastPlagues).map(function(p){return p.name+':'+p.everInfected;}).sort().join(','),
      S2.creatures.filter(function(c){return c.alive;}).map(function(c){
        return c.mask+'@'+c.x.toFixed(3)+','+c.y.toFixed(3);}).sort().join('|')].join(' ~ ');
  }
  G.setSpeed(0);
  S.census();   // restore ends with one, so both sides must have had one
  var wanted=print(S), code2=window.SaveCode.encode(G);
  say('restoring   : replaying '+Math.round(window.SaveCode.decode(code2).ticks/24)+' years from the code...');
  window.SaveCode.restore(G, window.SaveCode.decode(code2), null, function(){
    G.setSpeed(0);
    var got=print(G.sim);
    if(got===wanted) say('round trip  : EXACT - same year, population, species, plagues and every genome/position');
    else{
      var w=wanted.split(' ~ '), g=got.split(' ~ '), names=['year','alive','born','deaths','species','plagues','creatures'];
      var diff=[];for(var i=0;i<w.length;i++)if(w[i]!==g[i])diff.push(names[i]);
      say('round trip  : DIFFERS in '+diff.join(', '));
      say('        was : '+wanted.slice(0,150));
      say('        got : '+got.slice(0,150));
    }
    say('errors after: '+(window.__errors.length?window.__errors.join(' | '):'none'));
  });
},2000);
</script></body></html>
